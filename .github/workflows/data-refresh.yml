name: Weekly data refresh
on:
  schedule:
    - cron: '17 5 * * 1'   # every Monday morning
  workflow_dispatch:
permissions: { contents: write, issues: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: check
        run: node scripts/refresh-data.mjs
      - name: Commit new rate snapshot
        run: |
          git config user.name "GridTrip data bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/shared/src/data/rates.ts
          git diff --cached --quiet || (git commit -m "Weekly ECB rate snapshot" && git push)
      - name: Report links that stopped working
        if: steps.check.outputs.broken != '0'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh issue create --title "Data check - some offer links stopped working" --body-file data-report.md
