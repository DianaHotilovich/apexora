name: Deploy demo to GitHub Pages
on:
  push: { branches: [main] }
  workflow_run: { workflows: ['Weekly data refresh'], types: [completed] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build -w @apexora/web
        env: { NEXT_BASE_PATH: '/${{ github.event.repository.name }}' }
      - run: touch apps/web/out/.nojekyll
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/out }
      - id: deploy
        uses: actions/deploy-pages@v4
